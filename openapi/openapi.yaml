openapi: 3.0.3
info:
  title: Kite API
  version: 0.3.0
  description: |
    Зовнішній REST/JSON-контракт Kite за шлюзом (`/api/v1`).

    Джерело правди для цього файлу — розділ 9 документації Kite; правила з 9.1
    (ідемпотентність, помилки, пагінація, ETag, трасування) описані тут
    параметрами й відповідями в `components`, а не словами.

    PATCH всюди має семантику злиття (RFC 7396): поля, яких немає в тілі,
    лишаються як були. Тіло їде як `application/json` — так його розуміють усі
    три генератори.

    У цій версії описано ядро: публічна частина й автентифікація (9.2),
    клієнтський кабінет (9.3) і прийом сканів (9.5). Kite Business і решта
    Kite Ops дописуються разом із відповідними сервісами.

    Шляхи `/internal/v1/**` — синхронні виклики між сервісами (5.4, п. 7):
    повз шлюз, з токеном сервісного акаунта (роль `SYSTEM`) і дозволом із
    `x-kite-permission`; вебхук mock-pay підписаний `Kite-Signature`.
  contact:
    name: Kite
    url: https://github.com/kite-post
  license:
    name: MIT
servers:
  - url: http://localhost:8080/api/v1
    description: Локальний стенд (kite-infra)
  - url: https://api.kite.ua/api/v1
    description: Прод (у моделі не існує)

tags:
  - name: auth
    description: Вхід за одноразовим кодом і оновлення токенів
  - name: public
    description: Публічні ендпоїнти без автентифікації
  - name: profile
    description: Профіль клієнта, телефони, довірені особи, налаштування
  - name: shipments
    description: Відправлення та керування доставкою
  - name: payments
    description: Оплата, бали, промокоди
  - name: lockers
    description: "Kite Box: відкриття комірки, камера зберігання"
  - name: care
    description: Претензії і підтримка
  - name: scans
    description: Скани персоналу
  - name: internal-pricing
    description: "Внутрішнє: pricing-service, сервіс → сервіс без шлюзу (5.4, п. 7)"
  - name: internal-network
    description: "Внутрішнє: network-service, сервіс → сервіс без шлюзу (5.4, п. 7)"
  - name: internal-payments
    description: "Внутрішнє: вебхук mock-pay → payment-service (10.3)"

security:
  - bearerAuth: []

paths:
  /auth/otp:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Надіслати код на телефон
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Код надіслано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Перевірити код і отримати токени
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Токени видано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Оновити токен доступу
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новий токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /public/track/{trackingNumber}:
    get:
      tags: [public]
      operationId: trackPublic
      summary: Публічний статус без персональних даних
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingNumberPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Публічне відстеження
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTracking'
        '404': { $ref: '#/components/responses/NotFound' }

  /public/locations:
    get:
      tags: [public]
      operationId: listPublicLocations
      summary: Точки на карті
      security: []
      parameters:
        - name: bbox
          in: query
          description: Прямокутник `minLon,minLat,maxLon,maxLat`
          schema:
            type: string
            example: 30.3,50.3,30.7,50.6
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/LocationType'
        - name: service
          in: query
          description: Фільтр за послугою точки
          schema:
            $ref: '#/components/schemas/LocationService'
        - name: openNow
          in: query
          schema:
            type: boolean
        - name: freeCellSize
          in: query
          description: Є вільна комірка такого розміру
          schema:
            $ref: '#/components/schemas/CellSize'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Сторінка точок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPage'
        '400': { $ref: '#/components/responses/BadRequest' }

  /public/locations/{id}:
    get:
      tags: [public]
      operationId: getPublicLocation
      summary: Картка точки
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Точка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404': { $ref: '#/components/responses/NotFound' }

  /public/quotes:
    post:
      tags: [public]
      operationId: calculateQuote
      summary: Калькулятор вартості
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Розрахунок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me:
    get:
      tags: [profile]
      operationId: getMe
      summary: Профіль клієнта
      responses:
        '200':
          description: Профіль
          headers:
            ETag:
              description: Версія ресурсу для `If-Match`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [profile]
      operationId: updateMe
      summary: Змінити профіль, мову, тему, тиху годину
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      responses:
        '200':
          description: Змінений профіль
          headers:
            ETag:
              description: Версія ресурсу для `If-Match`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/phones:
    get:
      tags: [profile]
      operationId: listPhones
      summary: Номери клієнта
      responses:
        '200':
          description: Номери
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerPhone'
    post:
      tags: [profile]
      operationId: addPhone
      summary: Додати номер (до трьох)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
      responses:
        '201':
          description: Номер додано, надіслано код
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPhone'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/phones/{id}/verify:
    post:
      tags: [profile]
      operationId: verifyPhone
      summary: Підтвердити номер кодом
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerifyRequest'
      responses:
        '200':
          description: Номер підтверджено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPhone'
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/phones/{id}/activate:
    post:
      tags: [profile]
      operationId: activatePhone
      summary: Зробити номер основним
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Номер основний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPhone'
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/phones/{id}:
    delete:
      tags: [profile]
      operationId: deletePhone
      summary: Прибрати номер
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Прибрано }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/trusted-persons:
    get:
      tags: [profile]
      operationId: listTrustedPersons
      summary: Довірені особи
      responses:
        '200':
          description: Довірені особи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrustedPerson'
    post:
      tags: [profile]
      operationId: addTrustedPerson
      summary: Додати довірену особу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedPersonRequest'
      responses:
        '201':
          description: Додано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedPerson'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/trusted-persons/{id}:
    delete:
      tags: [profile]
      operationId: deleteTrustedPerson
      summary: Прибрати довірену особу
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Прибрано }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/favorite-locations:
    get:
      tags: [profile]
      operationId: listFavoriteLocations
      summary: Улюблені точки
      responses:
        '200':
          description: Улюблені точки
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteLocation'
    post:
      tags: [profile]
      operationId: addFavoriteLocation
      summary: Додати улюблену точку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteLocationRequest'
      responses:
        '201':
          description: Додано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteLocation'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/favorite-locations/{id}:
    patch:
      tags: [profile]
      operationId: updateFavoriteLocation
      summary: Перейменувати улюблену точку
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteLocationPatch'
      responses:
        '200':
          description: Змінено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteLocation'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [profile]
      operationId: deleteFavoriteLocation
      summary: Прибрати улюблену точку
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Прибрано }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/notification-preferences:
    get:
      tags: [profile]
      operationId: getNotificationPreferences
      summary: Налаштування сповіщень
      responses:
        '200':
          description: Налаштування
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
    put:
      tags: [profile]
      operationId: replaceNotificationPreferences
      summary: Замінити налаштування сповіщень
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Налаштування
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/push-subscriptions:
    post:
      tags: [profile]
      operationId: addPushSubscription
      summary: Підписка web push або FCM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
      responses:
        '201':
          description: Підписано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscription'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/push-subscriptions/{id}:
    delete:
      tags: [profile]
      operationId: deletePushSubscription
      summary: Прибрати підписку
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Прибрано }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/bonuses:
    get:
      tags: [payments]
      operationId: getBonusAccount
      summary: Баланс балів і проводки
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Баланс і останні проводки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonusAccount'

  /me/external-tracking:
    get:
      tags: [shipments]
      operationId: listExternalTracking
      summary: Сторонні номери
      responses:
        '200':
          description: Сторонні номери
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalTracking'
    post:
      tags: [shipments]
      operationId: addExternalTracking
      summary: Додати сторонній номер
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalTrackingRequest'
      responses:
        '201':
          description: Додано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTracking'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/external-tracking/{id}:
    delete:
      tags: [shipments]
      operationId: deleteExternalTracking
      summary: Прибрати сторонній номер
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Прибрано }
        '404': { $ref: '#/components/responses/NotFound' }

  /shipments:
    post:
      tags: [shipments]
      operationId: createShipment
      summary: Створити чернетку або одразу підтверджене відправлення
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Відправлення створено
          headers:
            ETag:
              description: Версія ресурсу для `If-Match`
              schema:
                type: string
            Location:
              description: Шлях створеного відправлення
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [shipments]
      operationId: listShipments
      summary: Дашборд «мені / від мене / архів»
      parameters:
        - name: direction
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ShipmentDirection'
        - name: status
          in: query
          description: Фільтр за станом; можна повторювати
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ShipmentStatus'
          style: form
          explode: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Сторінка відправлень
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentPage'
        '400': { $ref: '#/components/responses/BadRequest' }

  /shipments/{id}:
    get:
      tags: [shipments]
      operationId: getShipment
      summary: Деталі відправлення
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Відправлення
          headers:
            ETag:
              description: Версія ресурсу для `If-Match`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [shipments]
      operationId: updateShipment
      summary: Змінити чернетку
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentPatch'
      responses:
        '200':
          description: Змінене відправлення
          headers:
            ETag:
              description: Версія ресурсу для `If-Match`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /shipments/{id}/confirm:
    post:
      tags: [shipments]
      operationId: confirmShipment
      summary: Підтвердити чернетку (T1, DRAFT → CREATED)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Підтверджено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /shipments/{id}/cancel:
    post:
      tags: [shipments]
      operationId: cancelShipment
      summary: Скасувати до прийому (T2)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelShipmentRequest'
      responses:
        '200':
          description: Скасовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shipments/{id}/qr:
    get:
      tags: [shipments]
      operationId: getShipmentQr
      summary: QR для відправки без етикетки
      description: Підписаний токен `kite://ship/{shipmentId}?t=<JWS, 7 днів>` у вигляді SVG.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: QR-код
          content:
            image/svg+xml:
              schema:
                type: string
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /shipments/{id}/timeline:
    get:
      tags: [shipments]
      operationId: getShipmentTimeline
      summary: Таймлайн подій і прогноз
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Таймлайн
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
        '404': { $ref: '#/components/responses/NotFound' }

  /shipments/{id}/actions:
    get:
      tags: [shipments]
      operationId: listShipmentActions
      summary: Доступні дії з цінами для поточного стану
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Доступні дії
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableAction'
        '404': { $ref: '#/components/responses/NotFound' }

  /shipments/{id}/actions/{action}:
    post:
      tags: [shipments]
      operationId: requestShipmentAction
      summary: Керування доставкою
      description: |
        Переадресація (T9, T10), відпустка (T11), зміна отримувача, продовження
        зберігання і відмова (T14). Платні дії повертають `payment` із
        `redirectUrl`, поки вона не оплачена.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: action
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DeliveryActionType'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryActionRequest'
      responses:
        '201':
          description: Дію прийнято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAction'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /payments:
    post:
      tags: [payments]
      operationId: createPayment
      summary: Створити платіж
      description: Повертає `redirectUrl` на сторінку mock-pay.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Платіж створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /payments/{id}:
    get:
      tags: [payments]
      operationId: getPayment
      summary: Стан платежу
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Платіж
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404': { $ref: '#/components/responses/NotFound' }

  /promo-codes/validate:
    post:
      tags: [payments]
      operationId: validatePromoCode
      summary: Перевірити промокод
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeValidateRequest'
      responses:
        '200':
          description: Результат перевірки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeValidation'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /lockers/{locationId}/open:
    post:
      tags: [lockers]
      operationId: openLockerCell
      summary: Відкрити комірку (отримання або відправка)
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCellRequest'
      responses:
        '200':
          description: Комірку відкрито
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenCellResult'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /storage-bookings:
    post:
      tags: [lockers]
      operationId: createStorageBooking
      summary: Забронювати камеру зберігання в Kite Box
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageBookingRequest'
      responses:
        '201':
          description: Заброньовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBooking'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [lockers]
      operationId: listStorageBookings
      summary: Мої бронювання
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Сторінка бронювань
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBookingPage'

  /claims:
    post:
      tags: [care]
      operationId: createClaim
      summary: Створити претензію
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
      responses:
        '201':
          description: Претензію створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [care]
      operationId: listClaims
      summary: Мої претензії
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Сторінка претензій
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPage'

  /claims/{id}/attachments:
    post:
      tags: [care]
      operationId: createClaimAttachment
      summary: Отримати посилання для завантаження фото
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
      responses:
        '201':
          description: Посилання на завантаження в MinIO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets:
    get:
      tags: [care]
      operationId: listTickets
      summary: Мої тікети
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Сторінка тікетів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
    post:
      tags: [care]
      operationId: createTicket
      summary: Створити тікет підтримки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Тікет створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /tickets/{id}/messages:
    post:
      tags: [care]
      operationId: addTicketMessage
      summary: Дописати повідомлення в тікет
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketMessageRequest'
      responses:
        '201':
          description: Повідомлення додано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'
        '404': { $ref: '#/components/responses/NotFound' }

  /scans:
    post:
      tags: [scans]
      operationId: submitScans
      summary: Пакет сканів (до 100)
      description: |
        Приймає scan-service. Ідемпотентність — за `scanId`, згенерованим на
        телефоні; повтор того самого `scanId` повертає попередній результат.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBatch'
      responses:
        '200':
          description: Результат по кожному скану
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBatchResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /ops/hubs/{hubId}/sort-hint/{barcode}:
    get:
      tags: [scans]
      operationId: getSortHint
      summary: Сортувальна підказка
      parameters:
        - name: hubId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: barcode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Barcode'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Підказка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SortHint'
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Внутрішні виклики (5.4, п. 7) ────────────────────────────────────────
  # Сервіс → сервіс напряму, повз шлюз: шлюз маршрутизує лише /api/v1 (9.1),
  # тож /internal/v1 назовні не виходить. Сервіс слухає ці шляхи без префікса
  # /api/v1. Виклик несе токен сервісного акаунта (client_credentials, роль
  # SYSTEM); потрібний дозвіл — у x-kite-permission. Тайм-аут 2 с і circuit
  # breaker — на боці того, хто викликає.

  /internal/v1/pricing/quotes:
    post:
      tags: [internal-pricing]
      operationId: calculateInternalQuote
      summary: Розрахунок ціни для відправлення
      description: |
        Викликає shipment-service під час створення й підтвердження накладної
        (сага 5.4, п. 4). Та сама математика, що й у публічному калькуляторі
        `/public/quotes`, але розрахунок зберігається (6.2, `quote`) і має `id`,
        на який накладна посилається. Зону pricing-service бере з
        network-service, якщо її не передали в запиті.
      x-kite-permission: pricing:quote
      servers:
        - url: http://pricing-service:8080
          description: Напряму в мережі стенда, без шлюзу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalQuoteRequest'
      responses:
        '200':
          description: Розрахунок, збережений на 15 хв
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /internal/v1/network/routes:
    get:
      tags: [internal-network]
      operationId: resolveRoute
      summary: Маршрут і зона між двома точками
      description: |
        Викликають shipment-service (запланований маршрут накладної, 6.2
        `shipment_route`) і pricing-service (зона для тарифу). Маршрут
        будується за таблицею маршрутизації і розкладом рейсів; відповідь
        можна кешувати до зміни мережі.
      x-kite-permission: network:route
      servers:
        - url: http://network-service:8080
          description: Напряму в мережі стенда, без шлюзу
      parameters:
        - name: originLocationId
          in: query
          required: true
          description: Точка, де відправлення приймуть
          schema:
            type: string
            format: uuid
        - name: destinationLocationId
          in: query
          required: true
          description: Точка, де його видадуть
          schema:
            type: string
            format: uuid
        - name: departAt
          in: query
          required: false
          description: Від якого моменту планувати; типово — зараз
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Маршрут
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRoute'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /internal/v1/payments/provider-events:
    post:
      tags: [internal-payments]
      operationId: receiveProviderEvent
      summary: Вебхук платіжного провайдера (mock-pay)
      description: |
        mock-pay повідомляє payment-service про результат платежу чи
        повернення (10.3). Токена Keycloak у провайдера немає, тож запит
        підписаний: `Kite-Signature: t=<час>,v1=<HMAC-SHA256(secret, t.body)>`,
        як вебхуки бізнесу (9.1); payment-service відкидає підпис, старший за
        5 хв. Ідемпотентність — за `eventId`: повтор отримує 204 без повторної
        обробки. Будь-яка відповідь, крім 2xx, — сигнал mock-pay повторити.
      security:
        - providerSignature: []
      servers:
        - url: http://payment-service:8080
          description: Напряму в мережі стенда, без шлюзу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPaymentEvent'
      responses:
        '204':
          description: Подію прийнято (або вже була прийнята раніше)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен Keycloak для клієнтів і персоналу
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Ключ організації для бізнес-інтеграцій
    providerSignature:
      type: apiKey
      in: header
      name: Kite-Signature
      description: |
        Підпис вебхука платіжного провайдера:
        `t=<unix-час>,v1=<hex HMAC-SHA256(secret, "<t>.<тіло>")>`. Секрет
        спільний для mock-pay і payment-service і задається на стенді.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackingNumberPath:
      name: trackingNumber
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TrackingNumber'
    Limit:
      name: limit
      in: query
      description: Розмір сторінки
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Курсор із `nextCursor` попередньої сторінки
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Обов'язковий для створення відправлень, платежів і дій з оплатою (9.1).
        Повтор із тим самим ключем повертає ту саму відповідь 24 години.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag версії, яку змінюємо
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Мова людських описів статусів
      schema:
        type: string
        enum: [uk, en]
        default: uk

  responses:
    BadRequest:
      description: Неправильний запит
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Немає або недійсний токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Немає прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Не знайдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфлікт стану або ключа ідемпотентності
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: ETag не збігся
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Не пройшла валідація або недозволений перехід
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Перевищено ліміт частоти
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: Помилка у форматі RFC 9457 (9.1)
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://kite.ua/problems/invalid-transition
        title:
          type: string
          example: Недозволений перехід стану
        status:
          type: integer
          format: int32
          example: 422
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Машинний код помилки Kite
          example: SHIPMENT_INVALID_TRANSITION
        requestId:
          type: string
          description: Значення `X-Request-Id`
        errors:
          type: array
          description: Помилки полів
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          example: recipient.phone
        code:
          type: string
          example: INVALID_FORMAT
        message:
          type: string

    Money:
      type: object
      description: Гроші в копійках; валюта завжди UAH (6.1)
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          example: 12000
        currency:
          type: string
          enum: [UAH]
          default: UAH
    TrackingNumber:
      type: string
      description: Номер відправлення у форматі UPU S10 (10.1)
      pattern: '^KT\d{9}UA$'
      example: KT123456785UA
    Barcode:
      type: string
      description: Штрих-код місця — номер із суфіксом місця (10.1)
      pattern: '^KT\d{9}UA-\d{2}$'
      example: KT123456785UA-01
    Phone:
      type: string
      description: Телефон у E.164
      pattern: '^\+380\d{9}$'
      example: '+380501234567'
    Locale:
      type: string
      enum: [uk, en]
    Theme:
      type: string
      enum: [LIGHT, DARK, SYSTEM]
    Role:
      type: string
      description: >-
        Роль у realm `kite` Keycloak — усі ролі з 3.1 і службова `SYSTEM`; імена
        збігаються з ролями realm і claim `realm_access.roles` access-токена.
        Не плутати з `ActorRole`: той описує лише того, хто виконав дію в
        подіях (персонал і `SYSTEM`), і є підмножиною цього переліку.
      enum:
        - CLIENT
        - BIZ_OWNER
        - BIZ_MEMBER
        - OPERATOR
        - SORTER
        - SHIFT_MANAGER
        - DRIVER
        - DISPATCHER
        - SUPPORT
        - ADMIN
        - SYSTEM

    ShipmentStatus:
      type: string
      description: Стани з 7.1
      enum:
        - DRAFT
        - CREATED
        - CANCELLED
        - ACCEPTED
        - IN_TRANSIT
        - AT_HUB
        - SORTED
        - ON_HOLD
        - READY_FOR_PICKUP
        - DELIVERED
        - RETURNED
        - LOST
    ShipmentType:
      type: string
      enum: [DOCUMENTS, PARCEL, CARGO]
    ShipmentDirection:
      type: string
      enum: [incoming, outgoing, archive]
    PayerType:
      type: string
      enum: [SENDER, RECIPIENT, BUSINESS]
    DeliveryZone:
      type: string
      enum: [CITY, REGION, COUNTRY]
    ServiceCode:
      type: string
      description: Додаткові послуги (бізнес-модель, «Джерела доходу»)
      enum: [COD, DECLARED_VALUE, PACKAGING, PAID_STORAGE, REDIRECT_AFTER_ARRIVAL]
    LocationType:
      type: string
      description: Типи точок мережі (6.2, `location`)
      enum: [BRANCH, FREIGHT_BRANCH, KITE_BOX, REGIONAL_HUB, TRUNK_HUB]
    LocationService:
      type: string
      enum: [SEND, RECEIVE, COD, CARGO, PACKAGING, STORAGE]
    CellSize:
      type: string
      enum: [S, M, L]
    EventCode:
      type: string
      description: Код події з каталогу 8.2
      pattern: '^KT\d{2}$'
      example: KT30

    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
          example: 50.4501
        lon:
          type: number
          format: double
          example: 30.5234
    Address:
      type: object
      required: [city, street]
      properties:
        city:
          type: string
        cityId:
          type: string
          format: uuid
        street:
          type: string
        building:
          type: string
        apartment:
          type: string
        postalCode:
          type: string
          pattern: '^\d{5}$'
    Dimensions:
      type: object
      description: Габарити в міліметрах (6.1)
      required: [lengthMm, widthMm, heightMm]
      properties:
        lengthMm:
          type: integer
          format: int32
          minimum: 1
        widthMm:
          type: integer
          format: int32
          minimum: 1
        heightMm:
          type: integer
          format: int32
          minimum: 1

    OpeningHours:
