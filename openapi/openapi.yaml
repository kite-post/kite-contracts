          type: string
          format: uuid
        destinationLocationId:
          type: string
          format: uuid
        zone:
          $ref: '#/components/schemas/DeliveryZone'
        stops:
          type: array
          description: Від точки прийому до точки видачі включно, у порядку проходження
          minItems: 2
          items:
            $ref: '#/components/schemas/RouteStop'
        plannedDeliveryAt:
          type: string
          format: date-time
          nullable: true
          description: Плановий час прибуття в точку видачі за розкладом
    ProviderPaymentEventType:
      type: string
      description: |
        Що сталося в платіжного провайдера. Таймаут 3-D Secure приходить як
        PAYMENT_FAILED з `failureCode: TIMEOUT`.
      enum: [PAYMENT_SUCCEEDED, PAYMENT_FAILED, REFUND_SUCCEEDED, REFUND_FAILED]
    ProviderFailureCode:
      type: string
      description: Причина відмови провайдера — для *_FAILED
      enum: [DECLINED, INSUFFICIENT_FUNDS, THREE_DS_FAILED, TIMEOUT]
    ProviderPaymentEvent:
      type: object
      description: |
        Тіло вебхука mock-pay → payment-service (10.3). Необов'язкові поля
        відсутні, а не null.
      required: [eventId, type, paymentId, providerReference, amount, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
          description: Ідентифікатор події провайдера — ключ ідемпотентності
        type:
          $ref: '#/components/schemas/ProviderPaymentEventType'
        paymentId:
          type: string
          format: uuid
          description: Платіж payment-service, переданий провайдеру під час створення
        refundId:
          type: string
          format: uuid
          description: Повернення коштів — для REFUND_*
        providerReference:
          type: string
          description: Ідентифікатор операції в провайдера
          example: mp_7f3c2a91
        amount:
          $ref: '#/components/schemas/Money'
        cardMask:
          type: string
          example: '4242 •••• •••• 4242'
        failureCode:
          $ref: '#/components/schemas/ProviderFailureCode'
        failureReason:
          type: string
          description: Людський опис відмови — для *_FAILED
        occurredAt:
          type: string
          format: date-time

    OpenCellRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [PICKUP, DROPOFF, STORAGE]
        shipmentId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        pickupCode:
          type: string
          pattern: '^\d{6}$'
    OpenCellResult:
      type: object
      required: [cellCode, opensAt, expiresAt]
      properties:
        cellCode:
          type: string
          example: KV-BOX-07-A01
        size:
          $ref: '#/components/schemas/CellSize'
        opensAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    StorageBookingRequest:
      type: object
      required: [locationId, size, days]
      properties:
        locationId:
          type: string
          format: uuid
        size:
          $ref: '#/components/schemas/CellSize'
        days:
          type: integer
          format: int32
          minimum: 1
          maximum: 14
    StorageBooking:
      type: object
      required: [id, locationId, size, status, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        cellCode:
          type: string
        size:
          $ref: '#/components/schemas/CellSize'
        status:
          type: string
          enum: [AWAITING_PAYMENT, ACTIVE, EXPIRED, CLOSED]
        price:
          $ref: '#/components/schemas/Money'
        payment:
          $ref: '#/components/schemas/Payment'
        expiresAt:
          type: string
          format: date-time
    StorageBookingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StorageBooking'
        nextCursor:
          type: string
          nullable: true

    ClaimType:
      type: string
      enum: [DELAY, DAMAGE, LOSS, SHORTAGE, WRONG_DELIVERY]
    ClaimStatus:
      type: string
      enum: [NEW, IN_REVIEW, APPROVED, REJECTED, COMPENSATED]
    CreateClaimRequest:
      type: object
      required: [shipmentId, type, description]
      properties:
        shipmentId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ClaimType'
        description:
          type: string
          maxLength: 2000
        claimedAmount:
          $ref: '#/components/schemas/Money'
    Claim:
      type: object
      required: [id, shipmentId, type, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        shipmentId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ClaimType'
        status:
          $ref: '#/components/schemas/ClaimStatus'
        description:
          type: string
        claimedAmount:
          $ref: '#/components/schemas/Money'
        approvedAmount:
          $ref: '#/components/schemas/Money'
        attachments:
          type: array
          items:
            type: object
            required: [id, url]
            properties:
              id:
                type: string
                format: uuid
              url:
                type: string
                format: uri
        createdAt:
          type: string
          format: date-time
    ClaimPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        nextCursor:
          type: string
          nullable: true
    AttachmentRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/heic, application/pdf]
        sizeBytes:
          type: integer
          format: int64
          maximum: 10485760
    UploadTicket:
      type: object
      required: [attachmentId, uploadUrl, expiresAt]
      properties:
        attachmentId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Підписане посилання PUT у MinIO
        expiresAt:
          type: string
          format: date-time
    TicketStatus:
      type: string
      enum: [OPEN, WAITING_CUSTOMER, WAITING_AGENT, CLOSED]
    CreateTicketRequest:
      type: object
      required: [subject, message]
      properties:
        subject:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 4000
        shipmentId:
          type: string
          format: uuid
          nullable: true
    TicketMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 4000
    TicketMessage:
      type: object
      required: [id, author, message, createdAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          type: string
          enum: [CUSTOMER, AGENT, SYSTEM]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    Ticket:
      type: object
      required: [id, subject, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        shipmentId:
          type: string
          format: uuid
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TicketPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        nextCursor:
          type: string
          nullable: true

    ExternalTrackingRequest:
      type: object
      required: [carrier, trackingNumber]
      properties:
        carrier:
          type: string
          maxLength: 50
        trackingNumber:
          type: string
          maxLength: 50
        label:
          type: string
    ExternalTracking:
      type: object
      required: [id, carrier, trackingNumber]
      properties:
        id:
          type: string
          format: uuid
        carrier:
          type: string
        trackingNumber:
          type: string
        label:
          type: string
        manualStatus:
          type: string
        updatedAt:
          type: string
          format: date-time

    ScanOperation:
      type: string
      description: Режими роботи сканера (10.2, п. 4)
      enum: [ACCEPT, UNLOAD, SORT, FILL_UNIT, LOAD, HANDOVER]
    ScanOutcome:
      type: string
      enum: [OK, WARNING, ERROR]
    ScanWarningCode:
      type: string
      enum: [DUPLICATE, WRONG_HUB, MISSORT, UNKNOWN_BARCODE, NOT_EXPECTED, UNIT_CLOSED]
    ScanItem:
      type: object
      required: [scanId, barcode, operation, scannedAt]
      properties:
        scanId:
          type: string
          format: uuid
          description: UUID, згенерований на телефоні — ключ ідемпотентності (10.2, п. 5)
        barcode:
          type: string
          description: Штрих-код місця, мішка, рейсу або комірки
          example: KT123456785UA-01
        operation:
          $ref: '#/components/schemas/ScanOperation'
        scannedAt:
          type: string
          format: date-time
          description: Час на пристрої; `occurred_at` журналу (8.3, п. 4)
        locationId:
          type: string
          format: uuid
        unitCode:
          type: string
          description: Мішок або контейнер, у який кладемо
        tripId:
          type: string
          format: uuid
        weightGrams:
          type: integer
          format: int64
        dimensions:
          $ref: '#/components/schemas/Dimensions'
    ScanBatch:
      type: object
      required: [deviceId, items]
      properties:
        deviceId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
          description: Сесія пейрингу з Kite Ops
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ScanItem'
    ScanResult:
      type: object
      required: [scanId, outcome]
      properties:
        scanId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/ScanOutcome'
        warningCode:
          $ref: '#/components/schemas/ScanWarningCode'
        message:
          type: string
        shipmentId:
          type: string
          format: uuid
          nullable: true
        statusAfter:
          $ref: '#/components/schemas/ShipmentStatus'
        sortHint:
          $ref: '#/components/schemas/SortHint'
    ScanBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ScanResult'
    SortHint:
      type: object
      description: Підказка сортувальнику (5.5, п. 2)
      required: [line, direction]
      properties:
        line:
          type: string
          example: Лінія 7
        direction:
          type: string
          example: Львів
        nextLocation:
          $ref: '#/components/schemas/LocationRef'
        unitCode:
          type: string
          nullable: true
