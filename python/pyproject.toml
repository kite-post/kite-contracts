[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "kite-contracts"
version = "0.3.0"
description = "Pydantic-моделі REST-контракту і подій Kite, згенеровані з kite-contracts."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.10",
]

[project.urls]
Homepage = "https://github.com/kite-post/kite-contracts"

[tool.hatch.build.targets.wheel]
packages = ["src/kite_contracts"]
